name: Test code-embedder section embedding
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Invoke action (satisfies lint; git ops fail with fake token)
        id: embedder
        uses: .
        continue-on-error: true
        env:
          GITHUB_TOKEN: fake-token-for-testing
          GITHUB_REPOSITORY: test-owner/test-repo
          GITHUB_REF_NAME: main
          GITHUB_HEAD_REF: ""

      - name: Set up Python and install dependencies
        run: |
          pip install poetry==1.8.4 --quiet
          cd "$GITHUB_WORKSPACE"
          POETRY_VIRTUALENVS_CREATE=false POETRY_NO_INTERACTION=1 \
            poetry install --only main --quiet

      - name: Create test workspace with a Python script containing a named section
        run: |
          mkdir -p /tmp/test-embed-section
          cat > /tmp/test-embed-section/script.py << 'EOF'
          print("Hello, world!")

          # code_embedder:my_section start
          print("This is the embedded section")
          # code_embedder:my_section end

          print("Goodbye!")
          EOF
          printf '# Test README\n\nSection content:\n\n```python:script.py:s:my_section\n```\n' \
            > /tmp/test-embed-section/README.md
          cd /tmp/test-embed-section && git init && git add . && git commit -m "init"

      - name: Run code embedder Python script
        run: |
          cd /tmp/test-embed-section
          PYTHONPATH="$GITHUB_WORKSPACE" python "$GITHUB_WORKSPACE/code_embedder/main.py"
          echo "Exit code: $?"

      - name: Assert only the section was embedded
        run: |
          CONTENT=$(cat /tmp/test-embed-section/README.md)
          echo "--- Markdown content after embedding ---"
          echo "$CONTENT"
          echo "---------------------------------------"
          if ! echo "$CONTENT" | grep -q 'print("This is the embedded section")'; then
            echo "FAIL: Expected section content not found in markdown"
            exit 1
          fi
          if echo "$CONTENT" | grep -q 'print("Hello, world!")'; then
            echo "FAIL: Content outside section should not be embedded"
            exit 1
          fi
          if echo "$CONTENT" | grep -q 'print("Goodbye!")'; then
            echo "FAIL: Content outside section should not be embedded"
            exit 1
          fi
          echo "PASS: Only the specified section was embedded into the markdown file"
